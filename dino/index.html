      ctx.scale(f, 1);
      // しっぽ
      ctx.fillStyle = '#c98a55';
      ctx.beginPath(); ctx.ellipse(-10, -16, 7, 12, -0.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#e3a874'; ctx.beginPath(); ctx.ellipse(-9, -17, 3.5, 8, -0.4, 0, Math.PI * 2); ctx.fill();
      // からだ
      ctx.fillStyle = '#c98a55'; ctx.beginPath(); ctx.ellipse(1, -9, 8, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#f6dcbc'; ctx.beginPath(); ctx.ellipse(3, -8, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
      // あたま
      ctx.fillStyle = '#c98a55'; ctx.beginPath(); ctx.arc(3, -20, 7, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-1, -25); ctx.lineTo(0, -31); ctx.lineTo(3, -26); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(6, -21, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ff9fb2'; ctx.beginPath(); ctx.arc(9.5, -19, 1.3, 0, Math.PI * 2); ctx.fill();
      // どんぐり（なげるまえ）
      if (!(e.throwAnim > 0)) { ctx.fillStyle = '#a0714f'; ctx.beginPath(); ctx.ellipse(8, -11, 3.5, 4, 0, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#6b4a3a'; ctx.fillRect(4.5, -15.5, 7, 2.5); }
    } else if (e.type === 'bee') {
      const flap = Math.sin(t * 30) * 0.5;
      const night = C.theme.stars;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.save(); ctx.translate(-3, -16); ctx.rotate(-0.5 + flap); ctx.beginPath(); ctx.ellipse(0, -5, 4, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.save(); ctx.translate(3, -16); ctx.rotate(0.5 - flap); ctx.beginPath(); ctx.ellipse(0, -5, 4, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = night ? '#b48ad8' : '#ffd23f'; ctx.beginPath(); ctx.ellipse(0, -10, 12, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = night ? '#5a3d80' : '#3b2b1b';
      ctx.fillRect(-4, -18.5, 3, 17); ctx.fillRect(3, -18.5, 3, 17);
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(dir * 7, -12, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(dir * 8, -12, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-dir * 12, -10); ctx.lineTo(-dir * 17, -9); ctx.lineTo(-dir * 12, -7); ctx.fill();
    }
    ctx.restore();
  }

  function drawWing(x, y, s, t, flapAmt = 1) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(Math.sin(t * 10) * 0.25 * flapAmt);
    ctx.fillStyle = '#ffffff'; ctx.strokeStyle = '#bcd6ee'; ctx.lineWidth = 1.2;

    ctx.restore();
  }

  function drawFlame(x, y, s, t) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    const w = Math.sin(t * 10) * 1.5;
    ctx.fillStyle = '#ff5e3a';
    ctx.beginPath(); ctx.moveTo(0, -14 + w); ctx.bezierCurveTo(9, -4, 11, 4, 0, 11); ctx.bezierCurveTo(-11, 4, -9, -4, 0, -14 + w); ctx.fill();
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.moveTo(0, -6 - w); ctx.bezierCurveTo(6, 0, 7, 5, 0, 9); ctx.bezierCurveTo(-7, 5, -6, 0, 0, -6 - w); ctx.fill();
    ctx.restore();

  function drawBolt(x, y, s) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#d99a00'; ctx.lineWidth = 1.5; ctx.lineJoin = 'round';

    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawItem(it, t) {
    const x = it.x + it.w / 2 - camX, y = it.y + it.h / 2 + offY;
    if (it.type === 'pop') { drawBerryShape(x, y, 1.1); return; }
    if (it.type === 'wing' || it.type === 'magnet' || it.type === 'bubble') {
      const yy = y + Math.sin(t * 4) * 1.5;
      if (it.type === 'wing') drawWing(x, yy, 1.1, t);
      else if (it.type === 'magnet') {
        ctx.save(); ctx.translate(x, yy); ctx.rotate(Math.sin(t * 3) * 0.15);
        ctx.strokeStyle = '#ff4f6d'; ctx.lineWidth = 6; ctx.lineCap = 'butt';
        ctx.beginPath(); ctx.arc(0, -1, 7, Math.PI, 0, true); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-7, -1); ctx.lineTo(-7, -9); ctx.moveTo(7, -1); ctx.lineTo(7, -9); ctx.stroke();
        ctx.strokeStyle = '#e8eef6'; ctx.beginPath(); ctx.moveTo(-7, -9); ctx.lineTo(-7, -13); ctx.moveTo(7, -9); ctx.lineTo(7, -13); ctx.stroke();
        ctx.restore();
      } else {
        ctx.fillStyle = 'rgba(170,225,255,0.45)'; ctx.strokeStyle = 'rgba(120,200,255,0.9)'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, yy, 11, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.beginPath(); ctx.ellipse(x - 4, yy - 4, 3, 2, -0.6, 0, Math.PI * 2); ctx.fill();
      }

    }

      ctx.save(); ctx.shadowColor = it.type === 'fire' ? '#ff9a5a' : '#ffe066'; ctx.shadowBlur = 12;
      if (it.type === 'fire') drawFlame(x, y + Math.sin(t * 4) * 1.5, 1, t); else drawBolt(x, y + Math.sin(t * 4) * 1.5, 1.05);
      ctx.restore();
      ctx.fillStyle = '#4a2f22';
      ctx.beginPath(); ctx.arc(x - 3, y + 2, 1.5, 0, Math.PI * 2); ctx.arc(x + 3, y + 2, 1.5, 0, Math.PI * 2); ctx.fill();

  function drawPole(t) {
    if (!pole) return;
    const x = pole.x - camX;
    ctx.strokeStyle = '#f2f2f2'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(x, pole.top + offY); ctx.lineTo(x, pole.bottom + offY); ctx.stroke();
    ctx.strokeStyle = '#c8c8d8'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x + 1.5, pole.top + offY); ctx.lineTo(x + 1.5, pole.bottom + offY); ctx.stroke();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(x, pole.top + offY - 4, 6, 0, Math.PI * 2); ctx.fill();
    const fy = pole.flagY + offY, wave = Math.sin(t * 5) * 3;
    ctx.fillStyle = '#ff8fa3';
    ctx.beginPath(); ctx.moveTo(x - 2, fy); ctx.lineTo(x - 34, fy + 10 + wave * 0.3); ctx.lineTo(x - 2, fy + 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; heart(x - 14, fy + 11, 4);

  }

  function drawBoss(t) {
    const b = boss;
    if (!b) return;
    if (b.inv > 0 && b.state !== 'down' && Math.floor(b.inv * 14) % 2 === 0) return;
    drawBossShots(t);
    if (b.kind === 'onigiri') { drawOnigiriBoss(b, t); return; }
    if (b.kind === 'mini') { drawMiniBoss(b, t); return; }
    const s = 0.5;
    let x = b.x + b.w / 2 - camX, y = b.y + b.h + offY;
    if (b.state === 'wind') x += Math.sin(t * 60) * 2;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(b.face, 1);
    if (b.state === 'charge') { ctx.rotate(0.12); ctx.shadowColor = '#ff7a3d'; ctx.shadowBlur = 16; }
    if (b.state === 'wind') { ctx.shadowColor = '#ff5e3a'; ctx.shadowBlur = 12; }
    let mood = 'normal';
    if (b.state === 'wind' || b.state === 'hurt' || b.state === 'dizzy') mood = 'ouch';
    if (b.state === 'charge') mood = 'fever';
    if (b.state === 'down') mood = b.t > 0.8 ? 'happy' : 'ouch';
    if (b.state === 'intro') mood = 'happy';
    const walk = b.state === 'walk' || b.state === 'charge';
    const bob = walk ? -Math.abs(Math.sin(t * 10)) * 3 : 0;
    drawChar(ctx, 'lion', 0, -66 * s + bob, s, t * (walk ? 1.6 : 1), mood, b.state === 'down' && b.t > 0.8 ? 1 : (walk ? 0.6 : 0));
    ctx.restore();
    // ふらふら星
    if (b.state === 'dizzy' || (b.state === 'down' && b.t < 0.8)) {
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) {
        const a = t * 5 + i * 2.1;
        star(ctx, x + Math.cos(a) * 26, y - 66 + Math.sin(a) * 7, 5);
      }
    }
  }

  function drawOnigiriBoss(b, t) {
    const s = 0.48;
    let x = b.x + b.w / 2 - camX;
    const y = b.y + b.h + offY;
    const ground = GROUND * TS + offY;
    // 地面の かげ（どこに おちてくるか わかる）
    if (b.y + b.h < GROUND * TS - 4 && b.state !== 'wait') {
      const k = Math.max(0.3, 1 - (GROUND * TS - b.y - b.h) / 300);
      ctx.fillStyle = `rgba(120,90,130,${b.state === 'aim' ? 0.45 : 0.25})`;
      ctx.beginPath(); ctx.ellipse(x, ground - 2, 26 * k, 6 * k, 0, 0, Math.PI * 2); ctx.fill();
    }
    if (b.state === 'aim' && b.t > 0.5) x += Math.sin(t * 60) * 2;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(b.face, 1);
    if (b.state === 'land') ctx.scale(1.12, 0.88);
    if (b.state === 'aim') { ctx.shadowColor = '#ff8fa3'; ctx.shadowBlur = 14; }
    let mood = 'normal';
    if (b.state === 'aim' || b.state === 'slam') mood = 'fever';
    if (b.state === 'land' || b.state === 'hurt') mood = 'ouch';
    if (b.state === 'down') mood = b.t > 0.8 ? 'happy' : 'ouch';
    if (b.state === 'intro') mood = 'happy';
    const flying = ['intro', 'float', 'aim', 'rise', 'hurt'].includes(b.state);
    // ふわふわ ういている ときは うでを パタパタ
    drawChar(ctx, 'moko', 0, -66 * s, s, t * 1.4, mood, flying || (b.state === 'down' && b.t > 0.8) ? 1 : 0);
    ctx.restore();
    if (b.state === 'land' || (b.state === 'down' && b.t < 0.8)) {
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; star(ctx, x + Math.cos(a) * 26, y - 62 + Math.sin(a) * 7, 5); }
    }
  }

  function drawBossShots(t) {
    for (const f of puffs) {
      const fx = f.x - camX, fy = f.y + offY;
      if (f.kind === 'fire') {          // むらさきの ほのお
        ctx.save(); ctx.translate(fx + 5, fy + 5); ctx.rotate(f.t * 18);
        ctx.fillStyle = '#9b6cff'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#e3d1ff'; ctx.beginPath(); ctx.arc(1.5, -1.5, 3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        continue;
      }
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(fx + 6, fy + 9, 7, 0, Math.PI * 2); ctx.arc(fx + 14, fy + 7, 8, 0, Math.PI * 2); ctx.arc(fx + 10, fy + 12, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#7a6a8a';
      ctx.beginPath(); ctx.arc(fx + 7.5, fy + 9, 1.3, 0, Math.PI * 2); ctx.arc(fx + 12.5, fy + 9, 1.3, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawMiniBoss(b, t) {
    const s = 0.29;
    const x = b.x + b.w / 2 - camX, y = b.y + b.h + offY;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(b.face, 1);
    if (b.state === 'tired') ctx.scale(1.08, 0.9);
    if (b.state === 'run' && b.ground) ctx.rotate(0.12);
    if (b.state === 'fire') { ctx.shadowColor = '#9b6cff'; ctx.shadowBlur = 12; }
    let mood = 'normal';
    if (b.state === 'run' || b.state === 'hop' || b.state === 'intro') mood = 'happy';
    if (b.state === 'fire') mood = 'fever';
    if (b.state === 'tired' || b.state === 'hurt') mood = 'ouch';
    if (b.state === 'down') mood = b.t > 0.8 ? 'happy' : 'ouch';
    const run = b.state === 'run' && b.ground;
    const bob = run ? -Math.abs(Math.sin(t * 18)) * 2 : 0;
    // むらさきの ぼうしで Dino と みわける
    const hat = COL.pinkHat, hatD = COL.pinkHatDark;
    COL.pinkHat = '#a77bdc'; COL.pinkHatDark = '#7d55b5';
    drawChar(ctx, 'pink', 0, -66 * s + bob, s, t * (run ? 2 : 1), mood, run || b.state === 'hop' || (b.state === 'down' && b.t > 0.8) ? 1 : 0);
    COL.pinkHat = hat; COL.pinkHatDark = hatD;
    // おうかん
    const cy = -128 * s + bob - 4;
    ctx.fillStyle = '#ffd23f'; ctx.strokeStyle = '#d99a00'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-8, cy + 6); ctx.lineTo(-8, cy - 2); ctx.lineTo(-4, cy + 2); ctx.lineTo(0, cy - 5); ctx.lineTo(4, cy + 2); ctx.lineTo(8, cy - 2); ctx.lineTo(8, cy + 6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ff5c7a'; ctx.beginPath(); ctx.arc(0, cy + 2, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // つかれた あせ と 星
    if (b.state === 'tired' || (b.state === 'down' && b.t < 0.8)) {
      ctx.fillStyle = '#ffe066';
      for (let i = 0; i < 3; i++) { const a = t * 5 + i * 2.1; star(ctx, x + Math.cos(a) * 16, y - 42 + Math.sin(a) * 5, 4); }
      ctx.fillStyle = '#8fd3ff';
      ctx.beginPath(); ctx.ellipse(x + 12, y - 30 + (t * 20) % 8, 2, 3, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBossBar() {
    const b = boss || (duo && duo.fight && duo.state !== 'ko' ? { hp: duo.hp, fight: true, state: '', kind: 'duo', name: T().duoName } : null);
    if (!b || !b.fight || b.state === 'down') return;
    const cx = viewW / 2, y = 124;   // ヒントの下
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    const bw = b.kind === 'duo' ? 284 : 184;
    roundRect(ctx, cx - bw / 2, y - 16, bw, 32, 16); ctx.fill();
    ctx.fillStyle = '#6b4a3a'; ctx.font = '800 13px "M PLUS Rounded 1c", sans-serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(`${T().boss} ${b.kind === 'mini' ? T().miniName : b.name}`, cx - 80 - (b.kind === 'duo' ? 50 : 0), y + 1);
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < b.hp ? '#ff5c7a' : 'rgba(107,74,58,0.2)';
      heart(cx + 34 + i * 18, y + 1, 6);
    }
  }

  function drawHouse() {
    if (!C.house) return;
    const x = C.house * TS - camX, base = GROUND * TS + offY, w = TS * 3;
    ctx.fillStyle = '#ffd6e0'; ctx.fillRect(x, base - 76, w, 76);
    ctx.fillStyle = '#a0715a';
    ctx.beginPath(); ctx.moveTo(x - 10, base - 74); ctx.lineTo(x + w / 2, base - 118); ctx.lineTo(x + w + 10, base - 74); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; roundRect(ctx, x + w / 2 - 12, base - 104, 24, 18, 4); ctx.fill();
    ctx.fillStyle = '#ff6b81'; heart(x + w / 2, base - 95, 6);
    ctx.fillStyle = '#8a5a44'; roundRect(ctx, x + w / 2 - 13, base - 44, 26, 44, 12); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(x + w / 2 + 7, base - 22, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#bfe4ff'; roundRect(ctx, x + 8, base - 62, 20, 18, 4); ctx.fill(); roundRect(ctx, x + w - 28, base - 62, 20, 18, 4); ctx.fill();
  }

  function drawCheck(k) {
    const x = k.x + 16 - camX, base = GROUND * TS + offY;
    ctx.strokeStyle = '#d8d0c8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(x, base); ctx.lineTo(x, base - 64); ctx.stroke();
    ctx.fillStyle = k.reached ? '#7ccf6a' : '#c9c1b8';
    ctx.beginPath(); ctx.moveTo(x, base - 64); ctx.lineTo(x + 22, base - 56); ctx.lineTo(x, base - 48); ctx.closePath(); ctx.fill();
  }

  function heart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s * 0.9);
    ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.4);
    ctx.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.9);
    ctx.fill();
  }

  function drawDino(t) {
    if (P.hidden) return;
    if (P.inv > 0 && Math.floor(P.inv * 14) % 2 === 0) return;
    const s = P.big ? 0.39 : 0.27;
    const x = P.x + P.w / 2 - camX, y = P.y + P.h + offY;
    ctx.save();
    ctx.translate(x, y);
    const sq = Math.sin(P.squash * Math.PI) * 0.12;
    ctx.scale((1 + sq) * P.face, 1 - sq);
    if (state === 'dying') ctx.rotate(Math.PI * Math.min(1, (2.2 - P.dieT) * 2));
    if (Math.abs(P.vx) > 180 && P.ground) ctx.rotate(0.12);
    if (P.star > 0) { ctx.shadowColor = `hsl(${(t * 400) % 360},100%,60%)`; ctx.shadowBlur = 16; }
    let mood = 'normal';
    if (state === 'dying') mood = 'ouch';
    else if (P.star > 0) mood = 'fever';
    else if (!P.ground || P.goalPhase) mood = 'happy';
    const bob = P.walkT > 0 ? -Math.abs(Math.sin(P.walkT * 14)) * 2 : 0;
    const wave = !P.ground ? 1 : (P.walkT > 0 ? Math.min(1, Math.abs(P.vx) / 140) : 0);
    // パワーで ぼうしの 色が かわる
    const hat = COL.pinkHat, hatD = COL.pinkHatDark;
    if (P.power === 'fire') { COL.pinkHat = '#ff8a4c'; COL.pinkHatDark = '#e0601a'; }
    if (P.power === 'bolt') { COL.pinkHat = '#ffd23f'; COL.pinkHatDark = '#e0a812'; }
    if (P.power === 'wing') {
      COL.pinkHat = '#9ad7ff'; COL.pinkHatDark = '#5fb3e6';
      drawWing(-12 * s / 0.27, -22 * s / 0.27, s / 0.27 * 0.9, t * (P.ground ? 0.5 : 2), P.ground ? 0.3 : 1);   // せなかの はね
    }
    if (P.boltT > 0) { ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 18; ctx.rotate(0.18); }
    drawChar(ctx, 'pink', 0, -66 * s + bob, s, t * (P.walkT > 0 ? 1.6 : 1), P.boltT > 0 ? 'fever' : mood, P.boltT > 0 ? 1 : wave);
    COL.pinkHat = hat; COL.pinkHatDark = hatD;
    ctx.restore();
    if (P.shield) {                 // 🫧 バリア
      const r = P.h * 0.75 + 4 + Math.sin(t * 5) * 1.5;
      ctx.fillStyle = 'rgba(170,225,255,0.22)'; ctx.strokeStyle = 'rgba(120,200,255,0.8)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y - P.h / 2, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.beginPath(); ctx.ellipse(x - r * 0.4, y - P.h / 2 - r * 0.45, 4, 2.5, -0.6, 0, Math.PI * 2); ctx.fill();
    }
    if (P.magnet > 0 && Math.random() < 0.3) particles.push({ x: P.x + P.w / 2 + (Math.random() - 0.5) * 40, y: P.y + (Math.random()) * P.h, vx: 0, vy: -30, life: 0.3, col: '#ff8fa3', r: 2 });
  }

  function render(t) {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    if (!C) { drawBackground(THEMES[0], t); return; }
    const baseOffY = offY;
    offY = baseOffY + camSY;          // たての スクロール
    drawBackground(C.theme, t);
    drawHouse();
    for (const k of checks) drawCheck(k);
    drawPole(t);
    drawTiles(t);
    for (const p of plats) drawPlat(p);
    for (const b of berries) if (!b.got && b.x > camX - 20 && b.x < camX + viewW + 20) drawBerryShape(b.x - camX, b.y + offY + Math.sin(t * 3 + b.x) * 2, 1);
    for (const it of items) drawItem(it, t);
    for (const a of acorns) {
      ctx.save(); ctx.translate(a.x + 6 - camX, a.y + 6 + offY); ctx.rotate(a.t * 10);
      ctx.fillStyle = '#a0714f'; ctx.beginPath(); ctx.ellipse(0, 1, 5, 6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#6b4a3a'; ctx.beginPath(); ctx.ellipse(0, -4, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (const f of shots) {
      ctx.save(); ctx.translate(f.x + 6 - camX, f.y + 6 + offY); ctx.rotate(f.spin);
      ctx.fillStyle = '#ff5e3a'; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd36b'; ctx.beginPath(); ctx.arc(1.5, -1.5, 3.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    for (const e of enemies) if (e.x > camX - 60 && e.x < camX + viewW + 60) drawEnemy(e, t);
    drawBoss(t);
    drawDuo(t);
    drawDino(t);
    for (const p of particles) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.col;
      const px = p.x - camX, py = p.y + offY;
      if (p.star) star(ctx, px, py, p.r * 1.6);
      else if (p.sq) ctx.fillRect(px - p.r, py - p.r, p.r * 2, p.r * 2);
      else { ctx.beginPath(); ctx.arc(px, py, p.r, 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.font = '800 14px "M PLUS Rounded 1c", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(80,50,40,0.85)'; ctx.fillStyle = p.col;
      ctx.strokeText(p.text, p.x - camX, p.y + offY); ctx.fillText(p.text, p.x - camX, p.y + offY);
    }
    ctx.globalAlpha = 1;
    offY = baseOffY;
    drawBossBar();
  }

  // ---------- 画面 ----------
  const $ = id => document.getElementById(id);
  const show = (id, on) => $(id).classList.toggle('hidden', !on);

  function updateHud() {
    if (!C) return;
    $('hudLives').textContent = `Dino × ${Math.max(0, lives)}`;
    $('hudBerry').textContent = `🍓 × ${berryCount}`;
    $('hudCourse').textContent = `1-${courseIdx + 1}`;
    $('hudScore').textContent = `${T().score} ${score}`;
  }

  function updatePowerUI() {
    const pw = P && P.power;
    $('fireBtn').classList.toggle('hidden', pw !== 'fire');
    $('dashBtn').classList.toggle('bolt', pw === 'bolt');
    $('dashBtn').textContent = (pw === 'bolt' ? '⚡' : '') + T().dash;
    const icons = ({ fire: '🔥', bolt: '⚡', wing: '🪽' }[pw] || '') + (P && P.magnet > 0 ? '🧲' : '') + (P && P.shield ? '🫧' : '');
    $('hudPower').classList.toggle('hidden', !icons);
    $('hudPower').textContent = icons;
  }
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.remove('hidden');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('hidden'), 3200);
  }

  function setScreen(s) {
    state = s; stateT = 0;
    show('title', s === 'title');
    show('intro', s === 'intro');
    show('pause', s === 'pause');
    show('clear', s === 'clear');
    show('over', s === 'over');
    const inGame = ['intro', 'play', 'pause', 'dying', 'goal', 'clear', 'over'].includes(s);
    show('hud', inGame);
    show('pad', touchUI && (s === 'play' || s === 'dying' || s === 'goal'));
    if (s !== 'play') clearInput();
  }

  function showIntro() {
    const hint = $('introHint');
    hint.classList.toggle('hidden', !C.auto);
    hint.textContent = C.auto ? T().autoHint : '';
    $('introNum').textContent = `1-${courseIdx + 1}`;
    $('introName').textContent = T().courses[courseIdx];
    $('introLives').textContent = `Dino × ${lives}`;
    setScreen('intro');
  }

  function startGame(i) {
    lives = 3; berryCount = 0; score = 0; checkpointCol = null; carry = null;
    loadCourse(i);
    showIntro();
    sfx.start();
  }

  function afterDeath() {
    if (lives <= 0) {
      saveBest();
      $('overScore').textContent = `${T().score} ${score}`;
      setScreen('over');
      return;
    }
    loadCourse(courseIdx);
    showIntro();
  }

  function saveBest() {
    if (score > (progress.best || 0)) { progress.best = score; saveProgress(); }
  }

  function courseClear() {
    carry = { big: P.big, power: P.power };
    progress.cleared[courseIdx] = true;
    saveBest(); saveProgress();
    const last = courseIdx === COURSES.length - 1;
    $('clearTitle').textContent = last ? T().ending : T().clear;
    $('clearScore').textContent = `${T().score} ${score}`;
    show('nextBtn', !last);
    setScreen('clear');
    buildCourses();
  }

  function buildCourses() {
    const box = $('courses');
    box.innerHTML = '';
    COURSES.forEach((_, i) => {
      const b = document.createElement('button');
      const ok = true;   // クリアしなくても ぜんぶの コースを あそべる
      b.className = 'course' + (progress.cleared[i] ? ' done' : '');
      b.disabled = !ok;
      b.innerHTML = `${ok ? '' : '🔒 '}1-${i + 1}${progress.cleared[i] ? ' ✔' : ''}<small></small>`;
      b.querySelector('small').textContent = T().courses[i];
      b.addEventListener('click', () => startGame(i));
      box.appendChild(b);
    });
    $('bestLine').textContent = progress.best ? `${T().best} ${progress.best}` : '';
  }

  function applyLang() {
    const t = T();
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const v = t[el.dataset.i18n];
      if (typeof v === 'string') el.textContent = v;
    });
    document.querySelectorAll('#langs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
    buildCourses();
    updateHud();
    updatePowerUI();
  }
  document.querySelectorAll('#langs button').forEach(b => b.addEventListener('click', () => {
    lang = b.dataset.lang; store.set('fuwamoko-lang', lang); applyLang(); beep(660, 0.08, 'triangle');
  }));

  function pause(on) {
    if (on && state === 'play') setScreen('pause');
    else if (!on && state === 'pause') setScreen('play');
  }
  $('pauseBtn').addEventListener('click', () => pause(state === 'play'));
  $('resumeBtn').addEventListener('click', () => pause(false));
  const toTitle = () => { saveBest(); C = null; carry = null; buildCourses(); setScreen('title'); };
  $('pauseTitleBtn').addEventListener('click', toTitle);
  $('clearTitleBtn').addEventListener('click', toTitle);
  $('overTitleBtn').addEventListener('click', toTitle);
  $('nextBtn').addEventListener('click', () => { checkpointCol = null; loadCourse(courseIdx + 1); showIntro(); });
  $('retryBtn').addEventListener('click', () => startGame(courseIdx));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

  // ---------- 入力 ----------
  function clearInput() {
    input.left = input.right = input.jump = input.jumpPressed = input.dash = input.dashPressed = input.firePressed = false;
    $('dpad').classList.remove('l', 'r');
    document.querySelectorAll('.pbtn.down').forEach(b => b.classList.remove('down'));
  }
  // 十字ボタン：指を すべらせても 左右が きりかわる
  (() => {
    const el = $('dpad');
    let id = null;
    const apply = e => {
      const r = el.getBoundingClientRect();
      const left = e.clientX < r.left + r.width / 2;
      input.left = left; input.right = !left;
      el.classList.toggle('l', left); el.classList.toggle('r', !left);
    };
    el.addEventListener('pointerdown', e => { e.preventDefault(); id = e.pointerId; try { el.setPointerCapture(id); } catch (err) {} apply(e); });
    el.addEventListener('pointermove', e => { if (e.pointerId === id) apply(e); });
    const up = e => { if (e.pointerId !== id) return; id = null; input.left = input.right = false; el.classList.remove('l', 'r'); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  })();
  function holdButton(id, onDown, onUp) {
    const el = $(id);
    const ptrs = new Set();
    el.addEventListener('pointerdown', e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      if (!ptrs.size) onDown();
      ptrs.add(e.pointerId); el.classList.add('down');
    });
    const up = e => {
      if (!ptrs.has(e.pointerId)) return;
      ptrs.delete(e.pointerId);
      if (!ptrs.size) { onUp(); el.classList.remove('down'); }
    };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  holdButton('jumpBtn', () => { input.jump = true; input.jumpPressed = true; }, () => { input.jump = false; });
  holdButton('dashBtn', () => { input.dash = true; input.dashPressed = true; }, () => { input.dash = false; });
  holdButton('fireBtn', () => { input.firePressed = true; }, () => {});
  window.addEventListener('touchstart', () => { if (!touchUI) { touchUI = true; resize(); setScreen(state); } }, { passive: true });

  const JUMP_KEYS = [' ', 'ArrowUp', 'w', 'W', 'z', 'Z', 'k', 'K'];
  const DASH_KEYS = ['x', 'X', 'Shift', 'j', 'J'];
  window.addEventListener('keydown', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = true;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = true;
    if (JUMP_KEYS.includes(k)) { if (!e.repeat && state === 'play') { input.jump = true; input.jumpPressed = true; } else input.jump = true; }
    if (DASH_KEYS.includes(k)) { input.dash = true; if (!e.repeat) input.dashPressed = true; }
    if ((k === 'c' || k === 'C' || k === 'f' || k === 'F') && !e.repeat) input.firePressed = true;
    if (k === 'p' || k === 'P' || k === 'Escape') pause(state === 'play');
    if ((k === 'Enter' || k === ' ') && !e.repeat) {
      if (state === 'title') startGame(0);
      else if (state === 'clear' && courseIdx < COURSES.length - 1) { checkpointCol = null; loadCourse(courseIdx + 1); showIntro(); }
      else if (state === 'over') startGame(courseIdx);
    }
    if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  });
  window.addEventListener('keyup', e => {
    const k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') input.left = false;
    if (k === 'ArrowRight' || k === 'd' || k === 'D') input.right = false;
    if (JUMP_KEYS.includes(k)) input.jump = false;
    if (DASH_KEYS.includes(k)) input.dash = false;
  });
  window.addEventListener('blur', clearInput);

  // ---------- ループ ----------
  const H_STEP = 1 / 120;
  const dbg = { manual: false };
  let last = 0, acc = 0;
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (state === 'intro') { stateT += dt; if (stateT > 1.6) setScreen('play'); }
    if ((state === 'play' || state === 'dying' || state === 'goal') && !dbg.manual) {
      acc += dt;
      while (acc >= H_STEP) { step(H_STEP); acc -= H_STEP; }
    } else acc = 0;
    render(now / 1000);
    if (state === 'title') drawHero(now / 1000);
    requestAnimationFrame(loop);
  }

  function drawHero(t) {
    const cv = $('heroCv'), c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height);
    drawChar(c, 'pink', 120, 150 - Math.abs(Math.sin(t * 4)) * 24, 1.45, t * 1.5, 'happy', 1);
  }

  applyLang();
  setScreen('title');
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
