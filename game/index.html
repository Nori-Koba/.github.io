<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ふわもこ おやつキャッチ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #fff6e0;
    --bg2: #ffe3ea;
    --ink: #6b4a3a;
    --accent: #ff8fa3;
    --yellow: #f9dc6b;
    --card: rgba(255, 255, 255, 0.88);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
    color: var(--ink);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
  #stage { position: relative; }
  canvas#game { display: block; border-radius: 24px; box-shadow: 0 10px 40px rgba(180, 120, 100, 0.25); }
  .screen {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 16px;
    border-radius: 24px;
  }
  .hidden { display: none !important; }
  h1 { margin: 0 0 4px; font-size: 30px; font-weight: 800; letter-spacing: 1px; color: #ff7f96;
       text-shadow: 3px 3px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff; }
  .sub { margin: 0 0 18px; font-size: 14px; }
  .chars { display: flex; gap: 8px; margin-bottom: 14px; }
  .char {
    background: var(--card); border: 3px solid transparent; border-radius: 18px;
    padding: 6px 4px 8px; width: 108px; cursor: pointer; transition: transform .15s, border-color .15s;
  }
  .char:hover { transform: translateY(-3px); }
  .char.selected { border-color: var(--accent); transform: translateY(-4px); box-shadow: 0 6px 16px rgba(255, 143, 163, .35); }
  .char canvas { width: 96px; height: 110px; display: block; margin: 0 auto; }
  .char .name { font-weight: 800; font-size: 14px; }
  .char .trait { font-size: 11px; opacity: .8; }
  button.big {
    font-family: inherit; font-size: 22px; font-weight: 800; color: #fff;
    background: var(--accent); border: none; border-radius: 999px; padding: 12px 40px;
    box-shadow: 0 5px 0 #e0687f; cursor: pointer; margin-top: 6px;
  }
  button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 #e0687f; }
  .help { font-size: 12px; line-height: 1.7; margin-top: 14px; background: var(--card); border-radius: 14px; padding: 8px 14px; }
  .best { font-size: 13px; margin-top: 8px; }
  .result-card { background: var(--card); border-radius: 22px; padding: 18px 26px; }
  .score-big { font-size: 48px; font-weight: 800; color: #ff7f96; margin: 4px 0; }
  .newrec { color: #f0a020; font-weight: 800; animation: pop .6s ease infinite alternate; }
  @keyframes pop { from { transform: scale(1); } to { transform: scale(1.12); } }
  #pauseBtn {
    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.8); color: var(--ink); font-size: 16px; font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <button id="pauseBtn" class="hidden" aria-label="一時停止">II</button>

    <div id="title" class="screen">
      <h1>ふわもこ おやつキャッチ</h1>
      <p class="sub">おともだちを えらんでね</p>
      <div class="chars" id="chars"></div>
      <button class="big" id="startBtn">スタート！</button>
      <div class="help">
        👆 ドラッグ / ← → キーで うごく<br>
        🍓🍰🧁🍩🍬 をキャッチ！ 🌶️ はにがて…<br>
        ⭐ でフィーバー！ 💖 でライフ回復
      </div>
      <div class="best" id="bestTitle"></div>
    </div>

    <div id="pause" class="screen hidden">
      <div class="result-card">
        <div style="font-size:26px;font-weight:800;">ひとやすみ</div>
        <button class="big" id="resumeBtn">つづける</button>
      </div>
    </div>

    <div id="result" class="screen hidden">
      <div class="result-card">
        <div style="font-size:20px;font-weight:800;">おなかいっぱい！</div>
        <canvas id="resultChar" width="192" height="220" style="width:96px;height:110px;"></canvas>
        <div class="score-big" id="finalScore">0</div>
        <div id="newRec" class="newrec hidden">🎉 しんきろく！ 🎉</div>
        <div id="stats" style="font-size:13px;margin:6px 0 10px;"></div>
        <button class="big" id="retryBtn">もういっかい</button><br>
        <button class="big" id="backBtn" style="background:#b9a08f;box-shadow:0 5px 0 #8f7767;font-size:16px;padding:8px 24px;margin-top:12px;">キャラをかえる</button>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- 基本設定 ----------
  const W = 400, H = 700;               // 論理サイズ
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
    scale = s;
    canvas.style.width = W * s + 'px';
    canvas.style.height = H * s + 'px';
    canvas.width = W * s * dpr;
    canvas.height = H * s * dpr;
    const stage = document.getElementById('stage');
    stage.style.width = W * s + 'px';
    stage.style.height = H * s + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---------- キャラクター ----------
  const CHARS = [
    { id: 'pink', name: 'ディノ', trait: 'バランスタイプ', speed: 1.0, width: 1.0 },
    { id: 'moko', name: 'おにぎり', trait: 'キャッチ範囲 ひろい', speed: 0.8, width: 1.3 },
    { id: 'lion', name: 'ひまわり', trait: 'うごきが はやい', speed: 1.3, width: 0.9 },
  ];

  const COL = {
    body: '#f6df86', bodyDark: '#e8c95e', belly: '#f4ece6',
    eyeIris: '#3f9a63', claw: '#5a3b2b', blush: '#f08aa0',
    pinkHat: '#e89aa5', pinkHatDark: '#d47e8b',
    mokoFur: '#f7e8a4', mokoHood: '#fbe36d',
    mane: '#f59a2a', maneDark: '#e07d14',
  };

  function ellipse(c, x, y, rx, ry, fill, rot = 0) {
    c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2);
    c.fillStyle = fill; c.fill();
  }

  // mood: 'normal' | 'happy' | 'ouch' | 'fever'
  function drawChar(c, type, x, y, s, t, mood = 'normal', armWave = 0) {
    c.save();
    c.translate(x, y);
    c.scale(s, s);
    const bob = Math.sin(t * 6) * 1.5;
    const furry = type === 'moko';
    const bodyCol = furry ? COL.mokoFur : COL.body;

    // 影
    ellipse(c, 0, 66, 34, 6, 'rgba(120,80,60,0.15)');

    // 足
    for (const sx of [-16, 16]) {
      ellipse(c, sx, 58, 12, 8, bodyCol);
      c.fillStyle = COL.claw;
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(sx + i * 4.5, 64, 1.8, 0, Math.PI * 2); c.fill(); }
    }

    c.translate(0, bob);

    // ライオンのたてがみ（後ろ）
    if (type === 'lion') {
      for (let i = 0; i < 11; i++) {
        const a = Math.PI + (i / 10) * Math.PI * 1.15 - 0.08;
        const r = 38;
        ellipse(c, Math.cos(a) * r, -22 + Math.sin(a) * r * 0.95, 16, 11, i % 2 ? COL.mane : COL.maneDark, a);
      }
      for (const sx of [-1, 1]) ellipse(c, sx * 38, -10, 12, 16, COL.maneDark, sx * 0.3);
    }

    // 腕
    const wave = Math.sin(t * 10) * 0.4 * armWave;
    for (const sx of [-1, 1]) {
      c.save();
      c.translate(sx * 28, 16);
      c.rotate(sx * (0.7 + (sx > 0 ? wave : -wave)) - (mood === 'happy' || mood === 'fever' ? sx * 0.9 : 0));
      ellipse(c, 0, 12, 7, 14, bodyCol);
      c.fillStyle = COL.claw;
      for (let i = -1; i <= 1; i++) { c.beginPath(); c.arc(i * 3, 25, 1.5, 0, Math.PI * 2); c.fill(); }
      c.restore();
    }

    // 体
    if (furry) fluffyEllipse(c, 0, 25, 30, 30, bodyCol, 14, 3);
    else ellipse(c, 0, 25, 30, 30, bodyCol);
    ellipse(c, 0, 29, 18, 20, COL.belly);
    if (furry) for (let i = 0; i < 14; i++) {
      const a = i * 2.4, r = (i % 5) * 3.5;
      ellipse(c, Math.cos(a) * r, 29 + Math.sin(a) * r * 1.1, 2.2, 2.2, '#fffaf5');
    }

    // ライオンのえり
    if (type === 'lion') {
      for (let i = 0; i < 6; i++) {
        const xx = -22 + i * 8.8;
        ellipse(c, xx, 4 + Math.abs(i - 2.5) * 1.2, 7, 7, i % 2 ? COL.mane : COL.maneDark);
      }
    }

    // 頭
    if (furry) fluffyEllipse(c, 0, -20, 38, 33, bodyCol, 22, 3.5);
    else ellipse(c, 0, -20, 38, 33, bodyCol);
    // 頭のハイライト
    ellipse(c, -14, -38, 10, 5, 'rgba(255,255,255,0.35)', -0.3);

    // ぼうし / フード
    if (type === 'pink') {
      c.beginPath();
      c.moveTo(-39, -24);
      c.bezierCurveTo(-42, -62, 42, -62, 39, -24);
      c.bezierCurveTo(20, -32, -20, -32, -39, -24);
      c.fillStyle = COL.pinkHat; c.fill();
      c.beginPath();
      c.moveTo(-39, -24); c.bezierCurveTo(-20, -32, 20, -32, 39, -24);
      c.lineWidth = 4; c.strokeStyle = COL.pinkHatDark; c.stroke();
      // ぼうしの小さなかお
      c.fillStyle = '#5a3b2b';
      c.beginPath(); c.arc(-6, -43, 1.8, 0, Math.PI * 2); c.arc(6, -43, 1.8, 0, Math.PI * 2); c.fill();
      c.beginPath(); c.moveTo(-3, -39); c.quadraticCurveTo(0, -35, 3, -39); c.lineWidth = 1.4; c.strokeStyle = '#5a3b2b'; c.stroke();
      ellipse(c, 0, -37.5, 1.6, 1.4, '#e05a70');
    } else if (type === 'moko') {
      for (let i = 0; i < 9; i++) {
        const a = Math.PI + (i / 8) * Math.PI;
        ellipse(c, Math.cos(a) * 34, -26 + Math.sin(a) * 28, 9, 8, COL.mokoHood);
      }
      // ちいさなおともだち（ねずみ風）
      ellipse(c, 0, -60, 12, 8, '#fbe9a0');
      ellipse(c, -9, -64, 5, 4, '#f3d77a', -0.5);
      ellipse(c, 9, -64, 5, 4, '#f3d77a', 0.5);
      c.fillStyle = '#5a3b2b';
      c.beginPath(); c.arc(-3.5, -60, 1.1, 0, Math.PI * 2); c.arc(3.5, -60, 1.1, 0, Math.PI * 2); c.fill();
    }

    // 目
    const eyeY = -16;
    if (mood === 'ouch') {
      c.strokeStyle = '#4a2f22'; c.lineWidth = 3; c.lineCap = 'round';
      for (const sx of [-1, 1]) {
        c.beginPath();
        const k = -sx, ex = sx * 14;
        c.moveTo(ex - 5 * k, eyeY - 5); c.lineTo(ex + 5 * k, eyeY); c.lineTo(ex - 5 * k, eyeY + 5);
        c.stroke();
      }
    } else if (mood === 'happy') {
      c.strokeStyle = '#4a2f22'; c.lineWidth = 3; c.lineCap = 'round';
      for (const sx of [-1, 1]) {
        c.beginPath(); c.arc(sx * 14, eyeY + 2, 6, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
      }
    } else {
      for (const sx of [-1, 1]) {
        ellipse(c, sx * 14, eyeY, 8, 9.5, '#fff');
        ellipse(c, sx * 14 + 1, eyeY + 0.5, 6.5, 7.5, COL.eyeIris);
        ellipse(c, sx * 14 + 1, eyeY + 1, 4, 5, '#1c1410');
        ellipse(c, sx * 14 + 3, eyeY - 3, 2.2, 2.6, '#fff');
        if (mood === 'fever') {
          c.fillStyle = '#fff6a0';
          star(c, sx * 14 - 1, eyeY + 3, 2.2, 1);
        }
      }
    }

    // ほっぺ
    c.strokeStyle = COL.blush; c.lineWidth = 1.6;
    for (const sx of [-1, 1]) {
      ellipse(c, sx * 25, -3, 6, 3.5, 'rgba(245,140,160,0.35)');
      for (let i = 0; i < 3; i++) {
        c.beginPath(); c.moveTo(sx * 25 - 4 + i * 3.5, -5); c.lineTo(sx * 25 - 6 + i * 3.5, -1); c.stroke();
      }
    }

    // 口
    c.lineCap = 'round';
    if (mood === 'ouch' || (type === 'lion' && mood === 'normal')) {
      ellipse(c, 0, 0, 4.5, 5.5, '#8a1f35');
    } else if (type === 'pink' || mood === 'happy' || mood === 'fever') {
      c.beginPath();
      c.moveTo(-9, -3); c.quadraticCurveTo(0, -2, 9, -3);
      c.quadraticCurveTo(6, 10, 0, 10); c.quadraticCurveTo(-6, 10, -9, -3);
      c.fillStyle = '#c2405f'; c.fill();
      ellipse(c, 0, 6, 4.5, 3, '#f08aa0');
    } else {
      c.beginPath(); c.moveTo(-6, -2); c.quadraticCurveTo(0, 4, 6, -2);
      c.strokeStyle = '#d4566f'; c.lineWidth = 2.2; c.stroke();
    }

    c.restore();
  }

  function fluffyEllipse(c, x, y, rx, ry, fill, n, bump) {
    ellipse(c, x, y, rx, ry, fill);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      ellipse(c, x + Math.cos(a) * rx, y + Math.sin(a) * ry, bump, bump, fill);
    }
  }

  function star(c, x, y, r, inner = 0.45) {
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const rr = i % 2 ? r * inner : r;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    c.closePath(); c.fill();
  }

  // ---------- 音 ----------
  let audio = null;
  function beep(freq, dur = 0.1, type = 'sine', vol = 0.08, slide = 0) {
    try {
      if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = freq;
      if (slide) o.frequency.linearRampToValueAtTime(freq + slide, audio.currentTime + dur);
      g.gain.setValueAtTime(vol, audio.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(); o.stop(audio.currentTime + dur);
    } catch (e) {}
  }
  const sfx = {
    catch: (combo) => beep(660 + Math.min(combo, 12) * 40, 0.09, 'triangle'),
    ouch: () => beep(220, 0.25, 'sawtooth', 0.05, -120),
    star: () => { [784, 988, 1175, 1568].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'triangle'), i * 70)); },
    heart: () => { [523, 659, 784].forEach((f, i) => setTimeout(() => beep(f, 0.12, 'sine'), i * 80)); },
    over: () => { [523, 440, 392, 330].forEach((f, i) => setTimeout(() => beep(f, 0.2, 'triangle'), i * 150)); },
  };

  // ---------- アイテム ----------
  const ITEMS = [
    { e: '🍓', pts: 10, w: 30, kind: 'good' },
    { e: '🍬', pts: 10, w: 22, kind: 'good' },
    { e: '🧁', pts: 20, w: 20, kind: 'good' },
    { e: '🍩', pts: 20, w: 16, kind: 'good' },
    { e: '🍰', pts: 50, w: 8, kind: 'good' },
    { e: '🌶️', pts: 0, w: 18, kind: 'bad' },
    { e: '⭐', pts: 30, w: 3, kind: 'star' },
    { e: '💖', pts: 10, w: 2.5, kind: 'heart' },
  ];
  function pickItem(elapsed) {
    const pool = ITEMS.map(it => ({ ...it, w: it.kind === 'bad' ? it.w * (0.6 + Math.min(elapsed / 60, 1.2)) : it.w }));
    let total = pool.reduce((a, b) => a + b.w, 0), r = Math.random() * total;
    for (const it of pool) { if ((r -= it.w) <= 0) return it; }
    return pool[0];
  }

  // ---------- ゲーム状態 ----------
  let selected = 0;
  let g = null;
  let state = 'title';
  let lastTime = 0;
  const keys = {};

  function newGame() {
    const ch = CHARS[selected];
    g = {
      ch, x: W / 2, targetX: null, vx: 0,
      score: 0, lives: 3, combo: 0, maxCombo: 0, caught: 0,
      items: [], particles: [], popups: [],
      spawnT: 0.5, elapsed: 0, fever: 0,
      mood: 'normal', moodT: 0, shake: 0, invuln: 0, t: 0,
    };
  }

  function spawn() {
    const it = pickItem(g.elapsed);
    const speedUp = 1 + Math.min(g.elapsed / 70, 1.4);
    g.items.push({
      ...it,
      x: 30 + Math.random() * (W - 60), y: -30,
      vy: (120 + Math.random() * 70) * speedUp * (it.kind === 'star' ? 1.2 : 1),
      sway: Math.random() * Math.PI * 2, rot: (Math.random() - 0.5) * 0.6,
    });
  }

  function burst(x, y, colors, n = 10, power = 160) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = power * (0.4 + Math.random() * 0.8);
      g.particles.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, life: 0.7 + Math.random() * 0.4,
        col: colors[i % colors.length], r: 3 + Math.random() * 4, star: Math.random() < 0.4,
      });
    }
  }
  function popup(x, y, text, col = '#ff7f96') { g.popups.push({ x, y, text, col, life: 0.9 }); }

  const PLAYER_Y = H - 110;

  function update(dt) {
    g.t += dt;
    g.elapsed += dt;
    const ch = g.ch;

    // 移動
    const maxSpeed = 520 * ch.speed;
    if (keys.left || keys.right) {
      g.targetX = null;
      const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      g.vx += dir * 3200 * ch.speed * dt;
      g.vx = Math.max(-maxSpeed, Math.min(maxSpeed, g.vx));
    } else if (g.targetX !== null) {
      const diff = g.targetX - g.x;
      g.vx = Math.max(-maxSpeed * 1.3, Math.min(maxSpeed * 1.3, diff * 14));
    } else {
      g.vx *= Math.pow(0.0005, dt);
    }
    g.x += g.vx * dt;
    g.x = Math.max(40, Math.min(W - 40, g.x));

    // タイマー
    if (g.fever > 0) g.fever -= dt;
    if (g.invuln > 0) g.invuln -= dt;
    if (g.moodT > 0) { g.moodT -= dt; if (g.moodT <= 0) g.mood = 'normal'; }
    if (g.shake > 0) g.shake -= dt;

    // 生成
    g.spawnT -= dt;
    if (g.spawnT <= 0) {
      spawn();
      const base = Math.max(0.28, 0.85 - g.elapsed * 0.009);
      g.spawnT = base * (g.fever > 0 ? 0.45 : 1) * (0.7 + Math.random() * 0.6);
    }

    // アイテム
    const catchW = 38 * ch.width;
    for (let i = g.items.length - 1; i >= 0; i--) {
      const it = g.items[i];
      it.y += it.vy * dt;
      it.sway += dt * 3;
      it.x += Math.sin(it.sway) * 20 * dt;
      const dx = Math.abs(it.x - g.x), dy = it.y - (PLAYER_Y - 30);
      if (dx < catchW && dy > -22 && dy < 30) {
        g.items.splice(i, 1);
        onCatch(it);
        continue;
      }
      if (it.y > H + 30) {
        g.items.splice(i, 1);
        if (it.kind === 'good') g.combo = 0;
      }
    }

    // パーティクル
    for (let i = g.particles.length - 1; i >= 0; i--) {
      const p = g.particles[i];
      p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) g.particles.splice(i, 1);
    }
    for (let i = g.popups.length - 1; i >= 0; i--) {
      const p = g.popups[i];
      p.y -= 50 * dt; p.life -= dt;
      if (p.life <= 0) g.popups.splice(i, 1);
    }
  }

  function onCatch(it) {
    const px = it.x, py = it.y;
    if (it.kind === 'bad') {
      if (g.fever > 0) { // フィーバー中は無敵
        burst(px, py, ['#ff6b6b', '#ffd36b'], 8);
        popup(px, py - 20, 'へっちゃら！', '#f0a020');
        g.score += 5;
        return;
      }
      if (g.invuln > 0) return;
      g.lives--; g.combo = 0; g.invuln = 1.0; g.shake = 0.3;
      g.mood = 'ouch'; g.moodT = 0.8;
      burst(px, py, ['#ff6b6b', '#c0392b'], 10);
      popup(px, py - 20, 'からいっ！', '#e04a4a');
      sfx.ouch();
      if (g.lives <= 0) gameOver();
      return;
    }
    g.combo++; g.caught++;
    g.maxCombo = Math.max(g.maxCombo, g.combo);
    const mult = (g.fever > 0 ? 2 : 1) * (1 + Math.floor(g.combo / 10) * 0.5);
    const pts = Math.round(it.pts * mult);
    g.score += pts;
    g.mood = 'happy'; g.moodT = 0.35;

    if (it.kind === 'star') {
      g.fever = 6;
      burst(px, py, ['#ffe066', '#ffb3c6', '#a0e7ff'], 24, 260);
      popup(px, py - 20, 'フィーバー！', '#f0a020');
      sfx.star();
    } else if (it.kind === 'heart') {
      if (g.lives < 3) { g.lives++; popup(px, py - 20, 'ライフ +1', '#ff5c8a'); }
      else popup(px, py - 20, '+' + pts, '#ff5c8a');
      burst(px, py, ['#ff8fb1', '#ffc2d4'], 14);
      sfx.heart();
    } else {
      burst(px, py, ['#ffb3c6', '#ffe066', '#fff'], 8);
      popup(px, py - 20, '+' + pts + (g.combo >= 5 ? '  ' + g.combo + 'combo' : ''));
      sfx.catch(g.combo);
    }
  }

  // ---------- 描画 ----------
  const clouds = Array.from({ length: 5 }, (_, i) => ({ x: Math.random() * W, y: 40 + i * 90, s: 0.6 + Math.random() * 0.6, v: 6 + Math.random() * 10 }));

  function drawBackground(t, fever) {
    const grd = ctx.createLinearGradient(0, 0, 0, H);
    if (fever) {
      const h = (t * 60) % 360;
      grd.addColorStop(0, `hsl(${h}, 90%, 92%)`);
      grd.addColorStop(1, `hsl(${(h + 60) % 360}, 90%, 88%)`);
    } else {
      grd.addColorStop(0, '#fff3d6');
      grd.addColorStop(1, '#ffdfe8');
    }
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);

    // 水玉
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    for (let yy = 0; yy < H; yy += 50) for (let xx = (yy / 50) % 2 ? 25 : 0; xx < W + 25; xx += 50) {
      ctx.beginPath(); ctx.arc(xx, yy, 5, 0, Math.PI * 2); ctx.fill();
    }
    // 雲
    for (const c of clouds) {
      c.x += c.v * 0.016; if (c.x > W + 60) c.x = -60;
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (const [ox, oy, r] of [[0, 0, 18], [18, -8, 22], [38, 0, 18], [18, 6, 18]]) {
        ctx.beginPath(); ctx.arc(c.x + ox * c.s, c.y + oy * c.s, r * c.s, 0, Math.PI * 2); ctx.fill();
      }
    }
    // 床（クッション風）
    ctx.fillStyle = '#c9d3c4';
    roundRect(ctx, -10, H - 60, W + 20, 80, 24); ctx.fill();
    ctx.fillStyle = '#b8c4b2';
    ctx.fillRect(0, H - 60, W, 6);
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  function drawHUD() {
    ctx.save();
    ctx.font = '800 26px "M PLUS Rounded 1c", sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#ff7f96';
    ctx.strokeText(g.score, 16, 14); ctx.fillText(g.score, 16, 14);
    ctx.font = '22px sans-serif';
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = i < g.lives ? 1 : 0.25;
      ctx.fillText('💖', 16 + i * 28, 48);
    }
    ctx.globalAlpha = 1;
    if (g.combo >= 3) {
      ctx.font = '800 16px "M PLUS Rounded 1c", sans-serif';
      ctx.fillStyle = '#f0a020'; ctx.lineWidth = 4;
      ctx.strokeText(g.combo + ' combo', 16, 80); ctx.fillText(g.combo + ' combo', 16, 80);
    }
    if (g.fever > 0) {
      ctx.textAlign = 'center';
      ctx.font = '800 28px "M PLUS Rounded 1c", sans-serif';
      const sc = 1 + Math.sin(g.t * 12) * 0.06;
      ctx.translate(W / 2, 110); ctx.scale(sc, sc);
      ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#f0a020';
      ctx.strokeText('★ FEVER ×2 ★', 0, 0); ctx.fillText('★ FEVER ×2 ★', 0, 0);
    }
    ctx.restore();
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.save();
    if (g && g.shake > 0) ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
    const t = g ? g.t : performance.now() / 1000;
    drawBackground(t, g && g.fever > 0);

    if (g && state !== 'title') {
      // アイテム
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      for (const it of g.items) {
        ctx.save();
        ctx.translate(it.x, it.y); ctx.rotate(Math.sin(it.sway) * it.rot);
        if (it.kind === 'star') {
          ctx.shadowColor = '#ffe066'; ctx.shadowBlur = 18;
        }
        ctx.font = '38px sans-serif';
        ctx.fillText(it.e, 0, 0);
        ctx.restore();
      }

      // プレイヤー
      const blink = g.invuln > 0 && Math.floor(g.invuln * 12) % 2 === 0;
      if (!blink) {
        ctx.save();
        ctx.translate(g.x, PLAYER_Y);
        const lean = Math.max(-0.15, Math.min(0.15, g.vx / 3000));
        ctx.rotate(lean);
        const mood = g.mood !== 'normal' ? g.mood : (g.fever > 0 ? 'fever' : 'normal');
        const sc = g.ch.width > 1.1 ? 0.95 * 1.05 : 0.95;
        drawChar(ctx, g.ch.id, 0, 0, sc, g.t, mood, Math.min(Math.abs(g.vx) / 300, 1));
        ctx.restore();
      }

      // パーティクル
      for (const p of g.particles) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = p.col;
        if (p.star) star(ctx, p.x, p.y, p.r * 1.4);
        else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
      }
      ctx.globalAlpha = 1;
      ctx.font = '800 18px "M PLUS Rounded 1c", sans-serif';
      ctx.textAlign = 'center';
      for (const p of g.popups) {
        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.fillStyle = p.col;
        ctx.strokeText(p.text, p.x, p.y); ctx.fillText(p.text, p.x, p.y);
      }
      ctx.globalAlpha = 1;
      drawHUD();
    }
    ctx.restore();
  }

  // ---------- ループ ----------
  function loop(now) {
    const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
    lastTime = now;
    if (state === 'play') update(dt);
    else if (g && state === 'over') { // 終了後も紙吹雪だけ動かす
      for (let i = g.particles.length - 1; i >= 0; i--) {
        const p = g.particles[i];
        p.vy += 400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (p.life <= 0) g.particles.splice(i, 1);
      }
    }
    render();
    drawPreviews(now / 1000);
    requestAnimationFrame(loop);
  }

  // ---------- 画面 ----------
  const $ = id => document.getElementById(id);
  const charsEl = $('chars');
  const previews = [];
  CHARS.forEach((ch, i) => {
    const el = document.createElement('div');
    el.className = 'char' + (i === selected ? ' selected' : '');
    const cv = document.createElement('canvas');
    cv.width = 192; cv.height = 220;
    el.appendChild(cv);
    el.insertAdjacentHTML('beforeend', `<div class="name">${ch.name}</div><div class="trait">${ch.trait}</div>`);
    el.addEventListener('click', () => {
      selected = i;
      [...charsEl.children].forEach((c, j) => c.classList.toggle('selected', j === i));
      beep(880, 0.08, 'triangle');
    });
    charsEl.appendChild(el);
    previews.push(cv);
  });

  function drawPreviews(t) {
    if (state === 'title') {
      previews.forEach((cv, i) => {
        const c = cv.getContext('2d');
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.clearRect(0, 0, cv.width, cv.height);
        const mood = i === selected ? 'happy' : 'normal';
        const hop = i === selected ? Math.abs(Math.sin(t * 5)) * -8 : 0;
        drawChar(c, CHARS[i].id, 96, 128 + hop, 1.35, t + i, mood, i === selected ? 1 : 0);
      });
    }
    if (state === 'over') {
      const cv = $('resultChar'), c = cv.getContext('2d');
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.clearRect(0, 0, cv.width, cv.height);
      drawChar(c, CHARS[selected].id, 96, 128 + Math.abs(Math.sin(t * 4)) * -6, 1.35, t, 'happy', 1);
    }
  }

  function showBest() {
    const b = +(store.get('fuwamoko-best') || 0);
    $('bestTitle').textContent = b ? `ハイスコア：${b}` : '';
  }

  function start() {
    newGame();
    state = 'play';
    $('title').classList.add('hidden');
    $('result').classList.add('hidden');
    $('pause').classList.add('hidden');
    $('pauseBtn').classList.remove('hidden');
    beep(660, 0.1, 'triangle'); setTimeout(() => beep(990, 0.15, 'triangle'), 100);
  }

  function gameOver() {
    state = 'over';
    sfx.over();
    $('pauseBtn').classList.add('hidden');
    const best = +(store.get('fuwamoko-best') || 0);
    const isNew = g.score > best;
    if (isNew) store.set('fuwamoko-best', g.score);
    $('finalScore').textContent = g.score;
    $('newRec').classList.toggle('hidden', !isNew);
    $('stats').innerHTML = `キャッチ ${g.caught}こ ／ さいだい ${g.maxCombo}コンボ<br>ハイスコア ${Math.max(best, g.score)}`;
    setTimeout(() => {
      $('result').classList.remove('hidden');
      if (isNew) for (let i = 0; i < 4; i++) setTimeout(() => burst(60 + Math.random() * (W - 120), 120 + Math.random() * 200, ['#ff8fa3', '#ffe066', '#9ad7ff', '#b6f0b0'], 24, 260), i * 250);
    }, 600);
  }

  function pause(on) {
    if (on && state === 'play') { state = 'pause'; $('pause').classList.remove('hidden'); }
    else if (!on && state === 'pause') { state = 'play'; $('pause').classList.add('hidden'); }
  }

  $('startBtn').addEventListener('click', start);
  $('retryBtn').addEventListener('click', start);
  $('backBtn').addEventListener('click', () => {
    state = 'title'; g = null;
    $('result').classList.add('hidden'); $('title').classList.remove('hidden');
    showBest();
  });
  $('pauseBtn').addEventListener('click', () => pause(true));
  $('resumeBtn').addEventListener('click', () => pause(false));
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); });

  // ---------- 入力 ----------
  function pointerX(e) {
    const r = canvas.getBoundingClientRect();
    return (e.clientX - r.left) / scale;
  }
  let dragging = false;
  canvas.addEventListener('pointerdown', e => { if (state === 'play') { dragging = true; g.targetX = pointerX(e); } });
  window.addEventListener('pointermove', e => {
    if (state !== 'play') return;
    if (dragging || e.pointerType === 'mouse') g.targetX = pointerX(e);
  });
  window.addEventListener('pointerup', () => { dragging = false; });

  window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === ' ' || e.key === 'Enter') {
      if (state === 'title' || (state === 'over' && !$('result').classList.contains('hidden'))) start();
      e.preventDefault();
    }
    if (e.key === 'Escape' || e.key === 'p') pause(state === 'play');
  });
  window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
  });

  showBest();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
